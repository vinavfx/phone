plugins {
    id 'com.android.application'
}

android {
    namespace 'app.phone.sms'
    compileSdk 34

    defaultConfig {
        applicationId 'app.phone.sms'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
